# Lint, type-check and test every push to main and every pull request, and check the package
# PyPI would get. The release workflow runs this whole workflow on the tagged commit first.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is where async callbacks only propagate through an explicit config.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      # Real-provider tests skip without GEMINI_API_KEY or a reachable Ollama server.
      - run: uv run pytest -q

  # The other end of the supported range (`langchain-core>=1.2.21,<2` in pyproject.toml).
  # `test` above always resolves langchain-core to today's latest 1.x, via the committed
  # `uv.lock` — that is the ceiling. One job, on 3.10 (the `test` matrix's own comment says why:
  # it is where async callbacks only propagate through an explicit config — the Python
  # version most likely to show a floor regression), pinned to the floor instead of a second
  # Python axis on the matrix above: the langchain-core range and the Python range are
  # orthogonal, and crossing them combinatorially buys little for the cost of the extra jobs.
  #
  # 1.2.21 is the first release whose `BaseChatModel` fills `profile` from
  # `_resolve_model_profile`, the hook the router reports its routes' shared profile through;
  # below it `router.profile` stays `None` (bisected: 1.2.20 fails `test_profile.py`).
  test-min-langchain-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.10"
      # `uv sync --locked` is deliberately not used here: the committed lock is what `test`
      # already exercises at the ceiling, and this job needs a different resolution entirely —
      # verified below rather than assumed, since a mistyped constraint would otherwise
      # silently re-resolve back to the ceiling and this job would test nothing new.
      #
      # Today's `langchain`, `langgraph` and provider packages need a newer langchain-core, so
      # each is held to the vintage current when langchain-core 1.2.21 shipped (2026-03-23):
      # `langchain`, `langgraph` and `langchain-tests` by version, their own dependencies by
      # `--exclude-newer-package`, so only *those* packages are held back rather than every
      # dependency in the resolution.
      #
      # The `dev` group pins `langchain-tests==1.1.9`, which itself requires
      # `langchain-core>=1.4.0` — a real conflict with the floor, not a resolver quirk — so the
      # group is left out and only what running `tests/` needs is added back with `--with`,
      # including `langchain-tests==1.1.5` for the standard-suite tests. `numpy` is what
      # `langchain_core.embeddings.DeterministicFakeEmbedding` needs, ordinarily pulled in
      # through the `dev` group.
      - name: Confirm langchain-core actually resolves to the floor
        run: |
          uv run --isolated --no-group dev \
            --with pytest --with pytest-asyncio --with python-dotenv --with numpy \
            --with 'langchain-core==1.2.21' --with 'langchain==1.2.13' --with 'langgraph==1.1.3' \
            --with 'langchain-tests==1.1.5' \
            --exclude-newer-package langgraph-prebuilt=2026-03-24 \
            --exclude-newer-package langgraph-checkpoint=2026-03-24 \
            --exclude-newer-package langchain-google-genai=2026-03-24 \
            --exclude-newer-package langchain-ollama=2026-03-24 \
            python -c "
          import importlib.metadata as metadata
          version = metadata.version('langchain-core')
          assert version == '1.2.21', f'expected langchain-core==1.2.21, resolved {version}'
          print('langchain-core', version)
          "
      # Real-provider and LangSmith tests skip without their credentials, which this job (like
      # `test` above) never sets.
      - name: Run the suite against the langchain-core floor
        run: |
          uv run --isolated --no-group dev \
            --with pytest --with pytest-asyncio --with python-dotenv --with numpy \
            --with 'langchain-core==1.2.21' --with 'langchain==1.2.13' --with 'langgraph==1.1.3' \
            --with 'langchain-tests==1.1.5' \
            --exclude-newer-package langgraph-prebuilt=2026-03-24 \
            --exclude-newer-package langgraph-checkpoint=2026-03-24 \
            --exclude-newer-package langchain-google-genai=2026-03-24 \
            --exclude-newer-package langchain-ollama=2026-03-24 \
            pytest tests -q

  # What PyPI gets: the built distributions, checked for a valid PyPI page, installed on their own
  # to show they need nothing beyond langchain-core, and tested as installed rather than from
  # `src/`, so a module or file missing from the wheel fails here instead of for a user.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv build
      - name: Check the README renders as the PyPI page
        run: uvx twine check --strict dist/*
      - name: Install the wheel alone; it must add nothing beyond langchain-core
        run: |
          uv venv -q /tmp/router
          uv pip install -q --python /tmp/router dist/*.whl
          core=$(uv pip show --python /tmp/router langchain-core | sed -n 's/^Version: //p')
          uv venv -q /tmp/core
          uv pip install -q --python /tmp/core "langchain-core==$core"
          names() { uv pip freeze --python "$1" | sed -E 's/[ =].*//' | grep -vx langchain-model-router; }
          diff <(names /tmp/router) <(names /tmp/core)
          /tmp/router/bin/python -c "import langchain_model_router"
      - name: Run the unit tests against the installed wheel
        run: |
          uv sync --locked --no-install-project
          uv pip install dist/*.whl
          uv run --no-sync python -c "
          import langchain_model_router
          assert 'site-packages' in langchain_model_router.__file__, langchain_model_router.__file__
          "
          uv run --no-sync pytest tests/unit_tests benchmark/tests -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
